<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Gradient Glowing Login Form</title>
    <link rel="stylesheet" type="text/css" href="assets/css/login-signup.css">
	<script src="login.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            font-family:  verdana, arial, helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        .form h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .inputbox {
            position: relative;
            margin-bottom: 20px;
        }

        .inputbox input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            outline: none;
            font-size: 16px;
        }

        .inputbox input:focus {
            border-color: #ff6f61;
        }

        .inputbox::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #ff6f61;
            border-radius: 3px;
            pointer-events: none;
        }

        .inputbox input:focus +::before {
            transform: scaleX(1.03) scaleY(1.03);
        }

        .inputbox i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 10px;
            color: #ccc;
        }

        .inputbox input[type="submit"] {
            background-color: #ff6f61;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .inputbox input[type="submit"]:hover {
            background-color: #9e7c7a;
        }

        p {
            font-size: 14px;
            margin-top: 10px;
        }

        p a {
            color: #ff6f61;
            text-decoration: none;
            font-weight:bold;
			font-family: verdana, arial, helvetica, sans-serif;
        }
    </style>
	
</head>

<body>
    <div class="container">
        <div class="form">
            <h2>Login Form</h2>
            <form id="form_id" method="post" name="myform">
                <div class="inputbox">
                    <i class="fa fa-user"></i>
                    <input type="text" name="username" placeholder="Username" id="username">
                </div>
                <div class="inputbox">
                    <i class="fa fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" id="password">
                </div>
                <div class="inputbox">
                    <input type="submit" value="Login" onclick="validate()">
                </div>
                <p> Don't have an account? <a href="signup.html">Click Here</a></p>
            </form>
        </div>
    </div>
</body>

</html>
